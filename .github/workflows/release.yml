name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: "27.2.12479018"

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-
      - name: Run tests
        run: cargo test --workspace --verbose

  rust-android:
    name: Rust → Android
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo install cargo-ndk
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-android-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-android-
      - name: Build .so
        run: cargo ndk -t arm64-v8a build --release -p camera-shared-core
      - name: Deploy to Android project
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libcamera_shared_core.so \
             android/app/src/main/jniLibs/arm64-v8a/
      - name: Generate Kotlin bindings
        run: |
          cargo run --bin uniffi-bindgen -- generate \
            --library target/aarch64-linux-android/release/libcamera_shared_core.so \
            --language kotlin \
            --out-dir android/app/src/main/java/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-deps
          path: |
            android/app/src/main/jniLibs/
            android/app/src/main/java/uniffi/

  release:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: rust-android
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Download Rust artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-deps
          path: android/

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Check if prerelease
        id: prerelease
        run: |
          if echo "${{ steps.version.outputs.VERSION }}" | grep -qE "alpha|beta|rc"; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Camera App ${{ steps.version.outputs.VERSION }}"
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/*.apk
          body: |
            ## ${{ steps.version.outputs.VERSION }}

            ### Install
            Download the APK below and install on your Android device.
            You may need to enable "Install from unknown sources" in Settings.