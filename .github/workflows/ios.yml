name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "shared-core/**"
      - "ios/**"
      - "scripts/build-ios.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "shared-core/**"
      - "ios/**"
      - "scripts/build-ios.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust → iOS static library + UniFFI bindings ──────────────────
  rust-ios:
    name: Rust → iOS (.a + Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-ios-registry-${{ hashFiles('shared-core/Cargo.lock', 'shared-core/Cargo.toml') }}
          restore-keys: rust-ios-registry-

      - name: Build Rust for iOS device (arm64)
        working-directory: shared-core
        run: |
          cargo build --release --target aarch64-apple-ios --lib

      - name: Build Rust for iOS simulator (arm64)
        working-directory: shared-core
        run: cargo build --release --target aarch64-apple-ios-sim --lib

      - name: Create universal simulator library
        working-directory: shared-core
        run: |
          mkdir -p ../target/universal-sim/release
          cp ../target/aarch64-apple-ios-sim/release/libcamera_shared_core.a ../target/universal-sim/release/

      - name: Generate UniFFI Swift bindings
        working-directory: shared-core
        run: |
          mkdir -p ../ios/CameraApp/Generated
          cargo run --bin uniffi-bindgen -- generate \
            --library ../target/aarch64-apple-ios/release/libcamera_shared_core.a \
            --language swift \
            --out-dir ../ios/CameraApp/Generated/
          echo "=== Generated files ==="
          ls -la ../ios/CameraApp/Generated/
          echo "=== Swift file size ==="
          wc -l ../ios/CameraApp/Generated/camera_shared_core.swift
          echo "=== Check FfiConverterTypeCameraError ==="
          grep -n 'FfiConverterTypeCameraError' ../ios/CameraApp/Generated/camera_shared_core.swift | head -5

      - name: Upload device library
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-lib
          path: target/aarch64-apple-ios/release/libcamera_shared_core.a

      - name: Upload simulator library
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-lib
          path: target/universal-sim/release/libcamera_shared_core.a

      - name: Upload Swift bindings
        uses: actions/upload-artifact@v4
        with:
          name: swift-bindings
          path: |
            ios/CameraApp/Generated/camera_shared_core.swift
            ios/CameraApp/Generated/camera_shared_coreFFI.h

  # ── iOS App Build ─────────────────────────────────────────────────
  ios-build:
    name: iOS App Build
    runs-on: macos-latest
    needs: rust-ios
    steps:
      - uses: actions/checkout@v4

      - name: Download device library
        uses: actions/download-artifact@v4
        with:
          name: ios-device-lib
          path: target/aarch64-apple-ios/release/

      - name: Download simulator library
        uses: actions/download-artifact@v4
        with:
          name: ios-sim-lib
          path: target/universal-sim/release/

      - name: Download Swift bindings
        uses: actions/download-artifact@v4
        with:
          name: swift-bindings
          path: ios/CameraApp/Generated/

      - name: Select Xcode version
        run: xcode-select -p

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build iOS app (simulator)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project CameraApp.xcodeproj \
            -scheme CameraApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5.0 2>&1 | tail -30; echo "EXIT: $?"

      - name: Archive unsigned .ipa
        run: |
          APP_PATH=$(find ios/build -name "CameraApp.app" -type d 2>/dev/null | head -1)
          if [[ -z "$APP_PATH" ]]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "CameraApp.app" -type d 2>/dev/null | head -1)
          fi
          if [[ -n "$APP_PATH" ]]; then
            echo "✅ Found .app at: $APP_PATH"
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r CameraApp.ipa Payload
            rm -rf Payload
            echo "✅ Created CameraApp.ipa"
            ls -lh CameraApp.ipa
          else
            echo "⚠️ No .app found"
          fi

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: camera-app-ios-unsigned
          path: CameraApp.ipa
          if-no-files-found: warn

  # ── SwiftLint (optional) ──────────────────────────────────────────
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --strict --path ios/
        continue-on-error: true