[package]
name = "camera-shared-core"
version = "0.1.0"
edition = "2021"
description = "Shared core library for camera app — Rust + UniFFI"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "camera_shared_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi-bindgen.rs"

[dependencies]
# UniFFI — 自动生成 Kotlin/Swift 绑定
uniffi = { version = "0.28", features = ["cli"] }
uniffi_bindgen = "0.28"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 图像处理
image = "0.25"

# 日志
log = "0.4"

# 错误处理
thiserror = "2"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[features]
default = []